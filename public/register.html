<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daftar — Aldi Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --cream: #faf8f4;
      --ink: #1a1714;
      --gold: #c9a84c;
      --gold-light: #e8d5a3;
      --muted: #7a736a;
      --border: #e2ddd6;
      --error: #c0392b;
      --success: #27ae60;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    body::before {
      content: '';
      position: fixed;
      top: -40%;
      left: -15%;
      width: 55vw;
      height: 55vw;
      background: radial-gradient(circle, rgba(201,168,76,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .auth-wrap {
      display: flex;
      width: 100%;
      max-width: 960px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(26,23,20,0.12);
    }

    /* LEFT PANEL */
    .auth-panel {
      width: 320px;
      flex-shrink: 0;
      background: var(--ink);
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .auth-panel::after {
      content: '';
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      border: 40px solid rgba(201,168,76,0.07);
      bottom: -60px;
      right: -60px;
    }

    .panel-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 600;
      color: #fff;
    }
    .panel-logo span { color: var(--gold); }

    .panel-text { position: relative; z-index: 1; }

    .panel-tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 400;
      color: #fff;
      line-height: 1.35;
      margin-bottom: 1rem;
    }
    .panel-tagline em { color: var(--gold); font-style: italic; }

    .panel-desc {
      color: rgba(255,255,255,0.45);
      font-size: 0.82rem;
      font-weight: 300;
      line-height: 1.7;
    }

    .panel-cta {
      color: rgba(255,255,255,0.5);
      font-size: 0.78rem;
    }
    .panel-cta a { color: var(--gold); text-decoration: none; font-weight: 500; }

    /* RIGHT — FORM */
    .auth-form-wrap {
      flex: 1;
      background: #fff;
      padding: 2.5rem 3rem;
      overflow-y: auto;
    }

    .form-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.9rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 0.3rem;
    }

    .form-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1.8rem;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .field-group {
      margin-bottom: 1.1rem;
    }

    .field-group.full { grid-column: 1/-1; }

    .field-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .field-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'Jost', sans-serif;
      font-size: 0.88rem;
      color: var(--ink);
      background: var(--cream);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field-group input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
      background: #fff;
    }

    .field-group input.has-error {
      border-color: var(--error);
    }

    .field-err {
      font-size: 0.7rem;
      color: var(--error);
      margin-top: 0.25rem;
      display: none;
    }

    /* Phone field with country selector */
    .phone-row {
      display: flex;
      gap: 0;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--cream);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .phone-row:focus-within {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
      background: #fff;
    }

    .country-select-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .country-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.75rem 0.8rem;
      background: transparent;
      border: none;
      border-right: 1.5px solid var(--border);
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      font-size: 0.82rem;
      color: var(--ink);
      white-space: nowrap;
      transition: background 0.2s;
    }

    .country-btn:hover { background: rgba(201,168,76,0.06); }

    .country-btn .flag { font-size: 1.1rem; }
    .country-btn .dial { font-weight: 500; color: var(--muted); }
    .country-btn .arrow { color: var(--muted); font-size: 0.65rem; }

    .country-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 280px;
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(26,23,20,0.12);
      z-index: 100;
      display: none;
      overflow: hidden;
    }

    .country-dropdown.open { display: block; }

    .country-search {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--border);
    }

    .country-search input {
      width: 100%;
      border: none;
      background: transparent;
      font-family: 'Jost', sans-serif;
      font-size: 0.82rem;
      color: var(--ink);
      outline: none;
    }

    .country-list {
      max-height: 220px;
      overflow-y: auto;
    }

    .country-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      font-size: 0.82rem;
      transition: background 0.15s;
    }

    .country-item:hover { background: var(--cream); }
    .country-item.active { background: rgba(201,168,76,0.1); }
    .country-item .flag { font-size: 1rem; }
    .country-item .cname { flex: 1; color: var(--ink); }
    .country-item .cdial { color: var(--muted); font-size: 0.75rem; }

    .phone-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: none;
      background: transparent;
      font-family: 'Jost', sans-serif;
      font-size: 0.88rem;
      color: var(--ink);
      outline: none;
      min-width: 0;
    }

    .phone-row.has-error { border-color: var(--error); }

    .btn-primary {
      width: 100%;
      padding: 0.9rem;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Jost', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      margin-top: 0.5rem;
    }

    .btn-primary:hover { background: #2d2a26; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    .error-box {
      background: #fdf0f0;
      color: var(--error);
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 1rem;
      border-left: 3px solid var(--error);
      display: none;
    }

    .success-box {
      background: #f0fdf4;
      color: var(--success);
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 1rem;
      border-left: 3px solid var(--success);
      display: none;
    }

    .form-footer {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .form-footer a {
      color: var(--ink);
      font-weight: 500;
      text-decoration: none;
    }

    .form-footer a:hover { color: var(--gold); }

    .password-strength {
      display: flex;
      gap: 3px;
      margin-top: 0.4rem;
    }

    .strength-bar {
      height: 3px;
      flex: 1;
      border-radius: 2px;
      background: var(--border);
      transition: background 0.3s;
    }

    @media (max-width: 680px) {
      .auth-panel { display: none; }
      .auth-form-wrap { padding: 2rem 1.5rem; }
      .field-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="auth-wrap">
  <!-- LEFT -->
  <div class="auth-panel">
    <div class="panel-logo">Aldi<span>Market</span></div>
    <div class="panel-text">
      <h2 class="panel-tagline">Buat<br/><em>Akun</em><br/>Gratis</h2>
      <p class="panel-desc">
        Bergabung dengan Aldi Market dan nikmati kemudahan belanja kebutuhan kerja premium setiap saat.
      </p>
    </div>
    <p class="panel-cta">Sudah punya akun? <a href="login.html">Masuk →</a></p>
  </div>

  <!-- RIGHT -->
  <div class="auth-form-wrap">
    <h1 class="form-title">Daftar Akun</h1>
    <p class="form-sub">Isi data diri kamu di bawah ini</p>

    <div class="error-box" id="errBox"></div>
    <div class="success-box" id="succBox"></div>

    <div class="field-row">
      <div class="field-group">
        <label>Nama Depan</label>
        <input type="text" id="firstName" placeholder="Nama depan"/>
        <p class="field-err" id="errFirstName"></p>
      </div>
      <div class="field-group">
        <label>Nama Belakang</label>
        <input type="text" id="lastName" placeholder="Nama belakang"/>
      </div>
    </div>

    <div class="field-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Buat username unik" oninput="checkUsername()"/>
      <p class="field-err" id="errUsername"></p>
    </div>

    <div class="field-group">
      <label>Nomor Telepon</label>
      <div class="phone-row" id="phoneRow">
        <div class="country-select-wrap">
          <button type="button" class="country-btn" id="countryBtn" onclick="toggleCountry()">
            <span class="flag" id="selFlag">🇮🇩</span>
            <span class="dial" id="selDial">+62</span>
            <span class="arrow">▼</span>
          </button>
          <div class="country-dropdown" id="countryDropdown">
            <div class="country-search">
              <input type="text" id="countrySearch" placeholder="Cari negara..." oninput="filterCountries()"/>
            </div>
            <div class="country-list" id="countryList"></div>
          </div>
        </div>
        <input
          type="tel"
          class="phone-input"
          id="phoneNum"
          placeholder="812 3456 7890"
        />
      </div>
      <p class="field-err" id="errPhone"></p>
    </div>

    <div class="field-group">
      <label>Email (Opsional)</label>
      <input type="email" id="email" placeholder="email@kamu.com"/>
    </div>

    <div class="field-row">
      <div class="field-group full">
        <label>Kata Sandi</label>
        <input type="password" id="password" placeholder="Min. 8 karakter" oninput="checkStrength()"/>
        <div class="password-strength">
          <div class="strength-bar" id="s1"></div>
          <div class="strength-bar" id="s2"></div>
          <div class="strength-bar" id="s3"></div>
          <div class="strength-bar" id="s4"></div>
        </div>
        <p class="field-err" id="errPass"></p>
      </div>
    </div>

    <div class="field-group">
      <label>Konfirmasi Kata Sandi</label>
      <input type="password" id="confirmPass" placeholder="Ulangi kata sandi"/>
      <p class="field-err" id="errConfirm"></p>
    </div>

    <button class="btn-primary" onclick="doRegister()">Buat Akun</button>

    <div class="form-footer">
      Sudah punya akun? <a href="login.html">Masuk Sekarang</a>
    </div>
  </div>
</div>


<script src="api.js"></script>
<script>
const countries = [
  { code: 'ID', flag: '🇮🇩', name: 'Indonesia', dial: '+62' },
  { code: 'MY', flag: '🇲🇾', name: 'Malaysia', dial: '+60' },
  { code: 'SG', flag: '🇸🇬', name: 'Singapura', dial: '+65' },
  { code: 'PH', flag: '🇵🇭', name: 'Filipina', dial: '+63' },
  { code: 'TH', flag: '🇹🇭', name: 'Thailand', dial: '+66' },
  { code: 'VN', flag: '🇻🇳', name: 'Vietnam', dial: '+84' },
  { code: 'BN', flag: '🇧🇳', name: 'Brunei', dial: '+673' },
  { code: 'KH', flag: '🇰🇭', name: 'Kamboja', dial: '+855' },
  { code: 'MM', flag: '🇲🇲', name: 'Myanmar', dial: '+95' },
  { code: 'LA', flag: '🇱🇦', name: 'Laos', dial: '+856' },
  { code: 'TL', flag: '🇹🇱', name: 'Timor Leste', dial: '+670' },
  { code: 'AU', flag: '🇦🇺', name: 'Australia', dial: '+61' },
  { code: 'JP', flag: '🇯🇵', name: 'Jepang', dial: '+81' },
  { code: 'KR', flag: '🇰🇷', name: 'Korea Selatan', dial: '+82' },
  { code: 'CN', flag: '🇨🇳', name: 'China', dial: '+86' },
  { code: 'IN', flag: '🇮🇳', name: 'India', dial: '+91' },
  { code: 'SA', flag: '🇸🇦', name: 'Arab Saudi', dial: '+966' },
  { code: 'AE', flag: '🇦🇪', name: 'Uni Emirat Arab', dial: '+971' },
  { code: 'QA', flag: '🇶🇦', name: 'Qatar', dial: '+974' },
  { code: 'GB', flag: '🇬🇧', name: 'Inggris', dial: '+44' },
  { code: 'US', flag: '🇺🇸', name: 'Amerika Serikat', dial: '+1' }
];

let selectedCountry = countries[0];
let filteredCountries = [...countries];

function renderCountryList() {
  const list = document.getElementById('countryList');
  list.innerHTML = filteredCountries.map((country, index) => `
    <div class="country-item ${country.code === selectedCountry.code ? 'active' : ''}" onclick="selectCountry(${index})">
      <span class="flag">${country.flag}</span>
      <span class="cname">${country.name}</span>
      <span class="cdial">${country.dial}</span>
    </div>
  `).join('');
}

function filterCountries() {
  const query = document.getElementById('countrySearch').value.toLowerCase();
  filteredCountries = countries.filter((country) => country.name.toLowerCase().includes(query) || country.dial.includes(query));
  renderCountryList();
}

function selectCountry(index) {
  selectedCountry = filteredCountries[index];
  document.getElementById('selFlag').textContent = selectedCountry.flag;
  document.getElementById('selDial').textContent = selectedCountry.dial;
  closeCountry();
}

function toggleCountry() {
  const dd = document.getElementById('countryDropdown');
  dd.classList.toggle('open');
  if (dd.classList.contains('open')) {
    document.getElementById('countrySearch').focus();
    renderCountryList();
  }
}

function closeCountry() {
  document.getElementById('countryDropdown').classList.remove('open');
}

document.addEventListener('click', (event) => {
  if (!event.target.closest('.country-select-wrap')) closeCountry();
});

function checkStrength() {
  const pass = document.getElementById('password').value;
  const bars = ['s1','s2','s3','s4'].map((id) => document.getElementById(id));
  const colors = ['#e74c3c', '#e67e22', '#f1c40f', '#27ae60'];
  let score = 0;
  if (pass.length >= 8) score++;
  if (/[A-Z]/.test(pass)) score++;
  if (/[0-9]/.test(pass)) score++;
  if (/[^A-Za-z0-9]/.test(pass)) score++;
  bars.forEach((bar, i) => { bar.style.background = i < score ? colors[Math.max(score - 1, 0)] : 'var(--border)'; });
}

function checkUsername() {
  const val = document.getElementById('username').value.trim();
  const err = document.getElementById('errUsername');
  if (val.length < 4) {
    err.textContent = 'Min. 4 karakter';
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
}

async function doRegister() {
  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  const username = document.getElementById('username').value.trim();
  const phoneNum = document.getElementById('phoneNum').value.replace(/\D/g, '');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmPass = document.getElementById('confirmPass').value;

  const errBox = document.getElementById('errBox');
  const succBox = document.getElementById('succBox');
  errBox.style.display = 'none';
  succBox.style.display = 'none';

  let valid = true;

  if (!firstName) {
    document.getElementById('errFirstName').textContent = 'Nama depan wajib diisi';
    document.getElementById('errFirstName').style.display = 'block';
    valid = false;
  } else {
    document.getElementById('errFirstName').style.display = 'none';
  }

  if (username.length < 4) {
    document.getElementById('errUsername').textContent = 'Username minimal 4 karakter';
    document.getElementById('errUsername').style.display = 'block';
    valid = false;
  } else {
    document.getElementById('errUsername').style.display = 'none';
  }

  if (phoneNum.length < 7) {
    document.getElementById('errPhone').textContent = 'Nomor telepon tidak valid';
    document.getElementById('errPhone').style.display = 'block';
    document.getElementById('phoneRow').classList.add('has-error');
    valid = false;
  } else {
    document.getElementById('errPhone').style.display = 'none';
    document.getElementById('phoneRow').classList.remove('has-error');
  }

  if (password.length < 8) {
    document.getElementById('errPass').textContent = 'Password min. 8 karakter';
    document.getElementById('errPass').style.display = 'block';
    valid = false;
  } else {
    document.getElementById('errPass').style.display = 'none';
  }

  if (password !== confirmPass) {
    document.getElementById('errConfirm').textContent = 'Kata sandi tidak sama';
    document.getElementById('errConfirm').style.display = 'block';
    valid = false;
  } else {
    document.getElementById('errConfirm').style.display = 'none';
  }

  if (!valid) return;

  const fullPhone = `${selectedCountry.dial}${phoneNum}`;

  try {
    const result = await window.AldiAPI.request('/auth/register', {
      method: 'POST',
      body: JSON.stringify({
        firstName,
        lastName,
        username,
        email,
        phone: fullPhone,
        password
      })
    });

    window.AldiAPI.setSession(result.user, result.token);
    succBox.textContent = 'Akun berhasil dibuat! Mengalihkan...';
    succBox.style.display = 'block';
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 1400);
  } catch (error) {
    errBox.textContent = error.message;
    errBox.style.display = 'block';
  }
}

renderCountryList();
</script>
</body>
</html>
